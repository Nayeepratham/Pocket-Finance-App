<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apps</title>
  <meta name="description" content="Home pages and privacy policies for my Android apps.">
  <style>
    :root { --bg: #fbf2ec; --card: #fffcf8; --text: #3e2f27; --muted: #8a7568; --accent: #e2703a; --border: #f0e2d8; --sky: #d4eefb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1512; --card: #2a201b; --text: #f6e8de; --muted: #b39f92; --accent: #f4a76a; --border: #3a2d26; --sky: #26313f; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 40px 16px 56px; }
    h1 { font-size: 38px; line-height: 1.15; margin: 0 0 24px; }
    .app { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px 22px; margin: 0 0 16px; }
    .app h2 { margin: 0 0 4px; font-size: 24px; }
    .app p { margin: 0 0 12px; color: var(--muted); }
    .app a { display: inline-block; margin: 0 14px 0 0; color: var(--accent); font-weight: 700; text-decoration: none; }
    .app a:hover { text-decoration: underline; }
    p.small { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
<main>
  <h1>Apps</h1>

  <!-- One block per app. To add an app, copy this block and the _new-app-template folder (see README). -->
  <section class="app">
    <h2>Coinlet</h2>
    <p>An offline expense and budget tracker for students and young earners.</p>
    <a href="coinlet/">Home page</a>
    <a href="coinlet/privacy-policy.html">Privacy policy</a>
  </section>

  <p class="small">Questions? Email <a href="mailto:pratham.supportt@gmail.com">pratham.supportt@gmail.com</a>.</p>
</main>
</body>
</html>
